# Static portfolio + blog. No PHP on purpose.
# Installed by deploy/server-setup.sh to /etc/nginx/sites-available/emretufekci-static

server {
    listen 80;
    listen [::]:80;
    server_name emretufekci.com www.emretufekci.com;
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://emretufekci.com$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.emretufekci.com;
    ssl_certificate /etc/letsencrypt/live/emretufekci.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/emretufekci.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    return 301 https://emretufekci.com$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name emretufekci.com;

    ssl_certificate /etc/letsencrypt/live/emretufekci.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/emretufekci.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /var/www/emretufekci.com;
    index index.html;
    access_log /var/log/nginx/emretufekci.com.access.log;
    error_log  /var/log/nginx/emretufekci.com.error.log;

    server_tokens off;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: https:; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; frame-src https://www.youtube-nocookie.com; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

    gzip on;
    gzip_types text/css application/javascript application/xml application/rss+xml image/svg+xml;

    location ~ /\. { deny all; }

    location /assets/ {
        expires 7d;
        add_header Cache-Control "public";
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    location = /feed.xml {
        default_type application/rss+xml;
        charset utf-8;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    error_page 404 /404.html;
}
